name: Desktop CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Continuous Integration on this commit
        if: github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const core = require('@actions/core');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const thisRunId = context.runId;
            const timeoutMs = 30 * 60 * 1000;
            const pollMs = 15000;
            const started = Date.now();

            while (Date.now() - started < timeoutMs) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                branch: 'main',
                event: 'push',
                per_page: 10,
              });

              // Exclude this workflow run if it appears in results.
              const ciRun = data.workflow_runs.find((run) => run.id !== thisRunId);

              if (ciRun) {
                core.info(`Found CI run #${ciRun.run_number} status=${ciRun.status} conclusion=${ciRun.conclusion}`);
                if (ciRun.status !== 'completed') {
                  await new Promise((resolve) => setTimeout(resolve, pollMs));
                  continue;
                }
                if (ciRun.conclusion === 'success') {
                  core.info('CI succeeded for this commit. Proceeding with CD.');
                  return;
                }
                core.setFailed(`CI did not succeed for ${sha}. Conclusion: ${ciRun.conclusion}`);
                return;
              }

              core.info('CI run not visible yet; polling again...');
              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

            core.setFailed(`Timed out waiting for CI on ${sha}`);

  build:
    needs: ci-gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Write .env.production (Vite + Electron)
        env:
          API_URL: ${{ secrets.API_URL }}
        shell: bash
        run: |
          if [ -z "$API_URL" ]; then
            echo "Missing API_URL"
            exit 1
          fi
          printf 'API_URL=%s\nBETA=false\n' "$API_URL" > .env.production
          printf 'API_URL=%s\nBETA=false\n' "$API_URL" > apps/desktop/.env.production

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Rebuild native modules (keytar)
        working-directory: apps/desktop
        run: npx --yes @electron/rebuild -f -w keytar

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: npm run package

      # macOS auto-update needs a Developer ID–signed build. Set CSC_LINK + CSC_KEY_PASSWORD
      # (p12). Optional: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID for notarization
      # (afterSign hook skips notarize when APPLE_ID is unset).
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No CSC_LINK: using ad-hoc signing (Gatekeeper / auto-update may block until Developer ID secrets are set)."
            export CSC_IDENTITY_AUTO='-'
            # electron-builder treats CSC_LINK="" (from empty secrets.*) as a path; path.resolve(cwd, "") is cwd → "not a file".
            unset CSC_LINK
          fi
          npm run package

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npm run package

      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: apps/desktop/release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: pkg
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: installers-windows
          path: assets/windows

      - uses: actions/download-artifact@v7
        with:
          name: installers-macos
          path: assets/macos

      - uses: actions/download-artifact@v7
        with:
          name: installers-linux
          path: assets/linux

      - name: Drop per-OS debug yml
        run: find assets -name builder-debug.yml -delete

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.pkg.outputs.tag }}
          name: Dadei App ${{ steps.pkg.outputs.tag }}
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: assets/windows/*.exe,assets/windows/*.yml,assets/macos/*.dmg,assets/macos/*.zip,assets/macos/*.yml,assets/linux/*.AppImage,assets/linux/*.yml
          token: ${{ secrets.GITHUB_TOKEN }}
