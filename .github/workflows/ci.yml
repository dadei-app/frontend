name: Continuous Integration

# PR pushes: validate on pull_request only (avoid duplicate runs from push + pull_request).
# main pushes: only for direct commits (skip merge/squash commits that already ran in the PR).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [test, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify app versions are in sync
        run: node scripts/check-versions.mjs

      - name: Run UI tests
        if: matrix.task == 'test'
        run: npm run test --workspace=@dadei/ui

      - name: Typecheck UI package
        if: matrix.task == 'typecheck'
        run: npm run build --workspace=@dadei/ui

      - name: Verify version bump on code changes
        if: matrix.task == 'test' && github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs origin/${{ github.base_ref }}

      - name: Verify version bump before release
        if: matrix.task == 'test' && github.event_name == 'push'
        run: node scripts/check-version-bump.mjs HEAD^

  release:
    name: Desktop CD
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/release-cd.yml
    secrets: inherit
