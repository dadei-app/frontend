name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify app versions are in sync
        run: node scripts/check-versions.mjs

      - name: Run UI unit tests
        run: npm run test --workspace=@dadei/ui

      - name: Verify version bump on code changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs origin/${{ github.base_ref }}
